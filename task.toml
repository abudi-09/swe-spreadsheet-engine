schema_version = "1.3"

[task]
name = "samples/spreadsheet-engine"
description = "Implement a spreadsheet formula evaluation engine (parser, dependency graph, cycle detection, error propagation) from scratch."
authors = [{ name = "Sample Author" }]
keywords = ["software-engineering", "parsing", "graphs", "interpreters"]

[metadata]
difficulty = "medium"
category = "software-engineering"
# A single scalar reward in [0, 1] = fraction of held-out cells computed correctly.
estimated_human_hours = 6

[environment]
# No network: the task is fully self-contained; the base image carries Python.
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 2048
workdir = "/app"

[agent]
# Long-horizon budget (seconds): 72000 = 20h, matching the FrontierSWE format.
timeout_sec = 72000

[verifier]
# Share the agent's container so the verifier sees /app/sheet.py directly.
# tests/ is uploaded to /tests/ only AFTER the agent finishes, so the agent
# never sees the hidden sheets or the grader.
environment_mode = "shared"
network_mode = "no-network"
timeout_sec = 600
